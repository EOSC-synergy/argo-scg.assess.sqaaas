        - /usr/bin/env sh .sqa/script.rose_authentic_mandrill.sh
        container: qc.doc_ultramarine_calm_moose
      github.com/ARGOeu/argo-scg git:
        commands:
        - /usr/bin/env sh .sqa/script.hunter_shy_turtle.sh
